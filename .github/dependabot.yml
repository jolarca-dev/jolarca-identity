version: 2

# Added 2026-10-04 with D-44. Both Actions refs in this repo are pinned to full
# commit SHAs (jolarca-identity#2) and the repo had no dependabot config at all,
# so every pin here was exact AND unmonitored -- a pin that ages quietly while
# still reading as compliant. Dependabot re-pins to the resolved commit with a
# version comment, so it satisfies AGENTS.md §5 rather than fighting it.
#
# Ecosystems are derived from tracked manifests, per the parity rule
# jolarca-hermes-agents enforces in tests/test_dependabot_coverage.py:
# pyproject.toml is tracked and declares [project] dependencies, so pip is
# honest here; .github/workflows/ci.yml exists, so github-actions is too.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
